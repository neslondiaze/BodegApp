# BodegApp — nginx main config (frontend, non-root, read-only friendly)
# Replaces the stock /etc/nginx/nginx.conf: pid lives in /tmp (tmpfs) so the
# root filesystem can stay read-only with zero capabilities.

# NOTE: no `user` directive — the master process always runs non-root here.

worker_processes  auto;

error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /dev/stdout;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    include /etc/nginx/conf.d/*.conf;
}
