# =============================================================================
# BodegApp — Frontend nginx (hardened, non-root)
# Serves the baked-in Vite SPA. Reached ONLY by the reverse proxy over the
# frontend-seg network (never exposed to the host).
#
# NOTE: nginx `add_header` does NOT inherit into a location that declares its
# own `add_header`. Locations below therefore avoid add_header (using
# `expires` / `default_type`) so the security headers apply to EVERY response.
# =============================================================================

server {
    # Unprivileged port (non-root user, zero capabilities).
    listen 8080;
    server_name _;

    # Serve only, never proxy. The edge proxy handles TLS and /api routing.
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (inherited by every location without its own add_header).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;

    # Healthcheck endpoint (default_type avoids add_header here).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # The SPA router handles all routes -> index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed static assets are immutable (`expires` sets Cache-Control
    # without breaking header inheritance).
    location /assets/ {
        expires 1y;
    }

    # Never serve hidden files (.git, .env, etc).
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
