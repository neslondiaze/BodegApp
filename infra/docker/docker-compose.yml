# =============================================================================
# BodegApp — Hardened Docker Compose (Sentinel Shield v1.0)
# Task: F0-02 | Owner: Alfredo (DevOps) | Review: Lead_Blue (F0-07)
# Reference: docs/REQUERIMIENTOS.md req 0-4 (Zero Trust)
#
# Zero Trust design:
#   - Four segmented networks. Each service joins ONLY the networks it
#     strictly needs: edge (host exposure), frontend-seg, api-seg, db-seg.
#   - ONLY the reverse proxy publishes host ports (80/443). No host ports
#     for api, frontend, postgres. No network_mode: host anywhere.
#   - Docker secrets are the single channel for sensitive material
#     (postgres password, JWT RS256 key pair, edge TLS material). No
#     plaintext secrets in environment variables or images.
#   - Per-container hardening: non-root users, read_only rootfs + tmpfs,
#     cap_drop: ALL (zero capabilities needed — all internal listen ports
#     are unprivileged), security_opt no-new-privileges, healthchecks on
#     every service, resource limits, pids_limit, init, restart policies.
#
# Backend/frontend build contracts are documented in README.md and must be
# reviewed by F0-03/F0-04 (Nelson) and F0-05 (Noris).
# =============================================================================

name: bodegapp

# -----------------------------------------------------------------------------
# Secrets — file-based. NEVER commit secrets/ to git (see .gitignore).
# In production, provision these files from a secret manager (Vault/SOPS)
# before deploy. See README.md for generation commands.
# -----------------------------------------------------------------------------
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  jwt_private_key:
    file: ./secrets/jwt_private_key.pem
  jwt_public_key:
    file: ./secrets/jwt_public_key.pem
  proxy_tls_cert:
    file: ./secrets/proxy_tls_cert.pem
  proxy_tls_key:
    file: ./secrets/proxy_tls_key.pem

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &default-hardening
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  read_only: true
  init: true
  restart: unless-stopped

services:
  # ---------------------------------------------------------------------------
  # Reverse proxy — the ONLY service exposed to the host (Zero Trust edge).
  # Terminates TLS, serves nothing itself: / -> frontend, /api/ -> api.
  # ---------------------------------------------------------------------------
  proxy:
    image: nginx:1.27-alpine
    container_name: bodegapp-proxy
    hostname: proxy
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./proxy/nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
      - frontend-seg
      - api-seg
    ports:
      - "80:8080"
      - "443:8443"
    secrets:
      # TLS material as Docker secrets. Compose file-based secrets mount as
      # root-owned 0400/0444, so the proxy keeps CAP_DAC_READ_SEARCH (the only
      # capability it retains, read-only file access bypass) to read them.
      - source: proxy_tls_cert
        target: /etc/nginx/certs/proxy_tls_cert.pem
      - source: proxy_tls_key
        target: /etc/nginx/certs/proxy_tls_key.pem
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging
    # Privilege model: master starts as root (only to read root-owned Docker
    # secrets, mode 0600 — Compose file-based secrets always mount root-owned
    # and uid/gid/mode in the secret definition are ignored outside swarm),
    # then drops workers to the unprivileged nginx user (UID 101) via the
    # `user` directive. All network-facing processes are non-root.
    # Capabilities: dropped ALL, retained only the minimum the master needs.
    cap_drop: ["ALL"]
    cap_add:
      - CHOWN              # manage cache/tmpfs entries owned by workers
      - SETGID             # drop worker privileges to nginx group
      - SETUID             # drop worker privileges to nginx user
      - DAC_READ_SEARCH    # read root-owned TLS secrets (read-only bypass)
    security_opt:
      - no-new-privileges:true
    read_only: true
    init: true
    restart: unless-stopped
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0755,size=16m,noexec,nosuid
      - /var/cache/nginx:uid=101,gid=101,mode=0755,size=32m,noexec,nosuid
    pids_limit: 64
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          pids: 64
          cpus: "0.50"
          memory: 128M
        reservations:
          cpus: "0.10"
          memory: 32M

  # ---------------------------------------------------------------------------
  # Frontend — nginx serving the Vite/React 19 build (Dockerfile.frontend).
  # NOT exposed to the host; reachable only by the proxy (frontend-seg).
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infra/docker/Dockerfile.frontend
      additional_contexts:
        docker: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    image: bodegapp/frontend:local
    container_name: bodegapp-frontend
    hostname: frontend
    expose:
      - "8080"
    networks:
      - frontend-seg
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    # Non-root: nginx image user (UID 101). Config and SPA baked into the
    # image at build time (immutable), pid lives in /tmp. tmpfs mounts are
    # pre-owned by UID 101 so a fully non-root nginx needs zero capabilities.
    user: "101:101"
    <<: *default-hardening
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0755,noexec,nosuid
      - /var/cache/nginx:uid=101,gid=101,mode=0755,noexec,nosuid
    pids_limit: 64
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          pids: 64
          cpus: "0.50"
          memory: 128M
        reservations:
          cpus: "0.10"
          memory: 32M

  # ---------------------------------------------------------------------------
  # API — FastAPI backend (built in parallel in backend/ by Nelson, F0-03/F0-04).
  # NOT exposed to the host; reachable only by the proxy (api-seg) and reaches
  # postgres only through db-seg. Auth: JWT RS256 via Docker secrets.
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/Dockerfile.api
    image: bodegapp/api:local
    container_name: bodegapp-api
    hostname: api
    expose:
      - "8000"
    environment:
      # Non-sensitive configuration ONLY. Sensitive values follow the
      # *_FILE convention and are read from Docker secrets at /run/secrets/.
      POSTGRES_USER: ${POSTGRES_USER:-bodegapp}
      POSTGRES_DB: ${POSTGRES_DB:-bodegapp}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      JWT_ALGORITHM: RS256
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    networks:
      - api-seg
      - db-seg
    secrets:
      - source: postgres_password
        target: postgres_password
      - source: jwt_private_key
        target: jwt_private_key
      - source: jwt_public_key
        target: jwt_public_key
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)" || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging
    # Privilege model: the entrypoint starts as root ONLY to stage the
    # root-owned Docker secrets into /tmp/keys (tmpfs, appuser-owned, mode
    # 0400), then execs uvicorn as the unprivileged appuser (UID 65532) via
    # setpriv --no-new-privs. All request-serving processes are non-root.
    # Compose file-based secrets (non-swarm) bind-mount with host ownership
    # and 0600 mode, so uid/gid/mode on the secret definition are ignored —
    # the staging copy is the reliable cross-platform pattern.
    cap_drop: ["ALL"]
    cap_add:
      - CHOWN              # chown staged secret copies to appuser
      - DAC_READ_SEARCH    # read the root-owned secret files
      - SETGID             # drop privileges to appgroup
      - SETUID             # drop privileges to appuser
    security_opt:
      - no-new-privileges:true
    read_only: true
    init: true
    restart: unless-stopped
    tmpfs:
      # Writable and executable: the healthcheck and staging copy run here.
      # Size is the real boundary (64m), contents are ephemeral.
      - /tmp:uid=65532,gid=65532,mode=0755,size=64m
    pids_limit: 128
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          pids: 128
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — multi-tenant datastore (isolation strategy defined by
  # backend F0-03: schema-per-tenant vs RLS). NOT exposed to the host; only
  # the api service shares db-seg.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: bodegapp-postgres
    hostname: postgres
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bodegapp}
      POSTGRES_DB: ${POSTGRES_DB:-bodegapp}
      # Official image convention: password read from Docker secret file.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # Non-sensitive runtime locale.
      TZ: ${TZ:-UTC}
    networks:
      - db-seg
    secrets:
      - source: postgres_password
        target: postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c password_encryption=scram-sha-256
      -c log_connections=on
      -c log_disconnections=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -t 5"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    # Privilege model: master starts as root to read the root-owned password
    # secret, then postgres runs its engine as the unprivileged postgres user
    # (UID 999, set by the image). Master needs SETUID/SETGID to drop
    # privileges, CHOWN/DAC_OVERRIDE/DAC_READ_SEARCH/FOWNER for the data
    # volume and secret reads. No direct host ports, internal-only network.
    cap_drop: ["ALL"]
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    read_only: true
    init: true
    restart: unless-stopped
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
      - /var/run/postgresql:size=16m,noexec,nosuid
    pids_limit: 256
    shm_size: 128mb
    stop_grace_period: 1m
    deploy:
      resources:
        limits:
          pids: 256
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

# -----------------------------------------------------------------------------
# Zero Trust network segmentation. Internal segments (internal: true) have
# no route to the outside: lateral movement and data exfiltration paths are
# cut by design. Only the edge segment carries published ports.
# -----------------------------------------------------------------------------
networks:
  edge:
    name: bodegapp-edge
    driver: bridge
    internal: false
    labels:
      bodegapp.zero-trust.segment: edge
  frontend-seg:
    name: bodegapp-frontend-seg
    driver: bridge
    internal: true
    labels:
      bodegapp.zero-trust.segment: frontend
  api-seg:
    name: bodegapp-api-seg
    driver: bridge
    internal: true
    labels:
      bodegapp.zero-trust.segment: api
  db-seg:
    name: bodegapp-db-seg
    driver: bridge
    internal: true
    labels:
      bodegapp.zero-trust.segment: database

volumes:
  postgres_data:
    name: bodegapp_postgres_data
