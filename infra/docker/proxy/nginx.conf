# =============================================================================
# BodegApp — Edge reverse proxy (hardened, non-root)
# The ONLY ingress of the platform (Zero Trust edge). Terminates TLS and
# forwards to the internal segments:
#   /      -> frontend (frontend-seg network)
#   /api/  -> api      (api-seg network)
# PostgreSQL is NEVER reachable from this container (db-seg is api-only).
#
# TLS material is provided as Docker secrets at /etc/nginx/certs/.
#
# NOTE: nginx `add_header` does NOT inherit into a location that declares its
# own `add_header`. Locations below therefore avoid add_header (using
# `default_type`) so the security headers apply to EVERY response.
# =============================================================================

# Basic rate limiting at the edge (per client IP).
limit_req_zone $binary_remote_addr zone=edge_req:10m rate=20r/s;
limit_req_status 429;

# Connection upgrade mapping (WebSocket-ready for future phases).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream frontend_upstream {
    server frontend:8080;
}

upstream api_upstream {
    server api:8000;
}

server {
    # Unprivileged internal port (host 80 maps here).
    listen 8080;
    server_name _;

    # Healthcheck endpoint (default_type avoids add_header here).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Everything else: force HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Unprivileged internal port (host 443 maps here).
    listen 8443 ssl;
    http2 on;
    server_name _;

    # TLS (material as Docker secrets, never baked into images).
    ssl_certificate     /etc/nginx/certs/proxy_tls_cert.pem;
    ssl_certificate_key /etc/nginx/certs/proxy_tls_key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Hide implementation details.
    server_tokens off;

    # Restricted access (staging): basic auth at the edge. The file is staged
    # by the service command (see docker-compose.yml) because the non-root
    # workers open it per-request and cannot read the root-owned secret
    # mounted at /run/secrets/.
    auth_basic "BodegApp Staging";
    auth_basic_user_file /tmp/proxy_htpasswd;

    # Security headers applied to ALL responses of this server block.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;

    # Request size limits.
    client_max_body_size 2m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Healthcheck also over TLS (no redirect to hit). NOT behind basic auth:
    # liveness probes must work without credentials (the compose healthcheck
    # and external uptime monitors hit this path).
    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API segment (proxy -> api over api-seg). NOTE: NO trailing slash on
    # proxy_pass: the backend serves /api/v1/* natively (FastAPI routers are
    # mounted with the /api/v1 prefix), so the full request path must be
    # preserved. A trailing slash here would strip /api and break every
    # frontend call (frontend calls /api/v1/... via VITE_API_BASE_URL=/api).
    #
    # auth_basic OFF here (intentional, ST-01): HTTP allows a single
    # Authorization header per request. The browser uses it for the edge
    # basic-auth credentials on the SPA; the frontend's axios interceptor
    # uses the SAME header for the app's Bearer tokens on /api/ calls. Edge
    # basic auth on /api/ would consume the header and break every
    # authenticated call — the login flow would be unusable. The API carries
    # its own auth model (JWT RS256 Bearer, argon2, uniform errors, rate
    # limit above) designed for direct exposure. Proper Zero-Trust fix
    # (delta, post-ST-01): cookie-based identity at the edge (Cloudflare
    # Access via cloudflared tunnel — same pattern as atheneia) which frees
    # the Authorization header for the app tokens.
    location /api/ {
        auth_basic off;
        limit_req zone=edge_req burst=40 nodelay;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering on;
    }

    # Frontend segment (proxy -> frontend over frontend-seg).
    location / {
        limit_req zone=edge_req burst=60 nodelay;
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
