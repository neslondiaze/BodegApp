# BodegApp — nginx main config (edge proxy, non-root, read-only friendly)
# Replaces the stock /etc/nginx/nginx.conf: pid lives in /tmp (tmpfs) so the
# root filesystem can stay read-only with zero capabilities.

# Workers drop to the unprivileged nginx user (master starts as root only to
# read root-owned Docker secrets, then workers serve as uid 101).
user  nginx;
worker_processes  auto;

error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /dev/stdout;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    # Resolvers for container DNS (Docker's embedded DNS).
    resolver  127.0.0.11 valid=10s;

    include /etc/nginx/conf.d/*.conf;
}
