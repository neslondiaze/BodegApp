<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BodegApp — Sistema de inventario para bodegas" />
    <title>BodegApp</title>
    <script>
      // Apply persisted color scheme before first paint to avoid FOUC.
      (function () {
        try {
          var stored = localStorage.getItem('bodegapp.theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored ? JSON.parse(stored) === 'dark' : prefersDark;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage unavailable — default light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
